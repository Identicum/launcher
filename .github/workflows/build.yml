name: build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # monthly rebuild, to pick up updates of the alpine-python base image
    - cron: '0 3 2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, mysql, mariadb, oracle]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -e '.[test]'
      - run: scripts/test-db.sh ${{ matrix.db }} -v

  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - launcher/static/vendor
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  docker-build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, analyze]
    permissions:
      contents: read
      packages: write
    uses: Identicum/github-actions/.github/workflows/docker-build-autotag.yml@main
    secrets: inherit
    with:
      image_name: launcher
