{% extends "base.html" %}

{% block title %}{{ status }} · {{ settings.app_title }}{% endblock %}

{% block content %}
<div class="empty-state">
  <i class="fa-solid {{ icon }}"></i>
  <h1 class="h5">{{ heading }}</h1>
  <p class="mb-0">{{ message }}</p>
  {% if user %}<a class="btn btn-outline-secondary mt-3" href="/">Back to the launcher</a>{% endif %}
</div>
{% endblock %}
