# Run the launcher on MySQL instead of PostgreSQL:
#   docker compose -f compose.yaml -f compose.mysql.yaml up -d
services:
    mysql:
        container_name: mysql
        image: mysql:8.4
        restart: always
        ports:
            - 3306:3306
        environment:
            MYSQL_ROOT_PASSWORD: mysqlpwd
            MYSQL_DATABASE: launcherdb
            MYSQL_USER: launcherusr
            MYSQL_PASSWORD: launcherpwd
        healthcheck:
            test: mysqladmin ping -h 127.0.0.1 -uroot -pmysqlpwd
            interval: 5s
            retries: 30

    launcher:
        environment:
            DB_TYPE: mysql
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy
