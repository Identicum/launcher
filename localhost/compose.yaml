# Local environment: Keycloak (IdP) + IPAx (OIDC proxy) + launcher on PostgreSQL.
# Needs "127.0.0.1 idp" in /etc/hosts. Open http://localhost and log in with demo/demo (admin) or user/user.
# Other databases: docker compose -f compose.yaml -f compose.oracle.yaml up -d   (or compose.mysql.yaml)
name: launcher

services:
    db:
        container_name: db
        image: ghcr.io/identicum/postgres:16
        pull_policy: always
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_PASSWORD: postgrespwd
        volumes:
            - ./db/init/:/docker-entrypoint-initdb.d/:ro

    idp:
        container_name: idp
        image: ghcr.io/identicum/keycloak:26.8
        pull_policy: always
        restart: always
        ports:
            - 8080:8080
        env_file:
            - ./keycloak.env
        depends_on:
            db:
                condition: service_healthy

    idp_config:
        container_name: idp_config
        image: ghcr.io/identicum/sherpa-deploy:latest
        pull_policy: always
        volumes:
            - ./terraform/:/usr/home/
        command: "./apply.sh"
        depends_on:
            idp:
                condition: service_healthy

    launcher:
        container_name: launcher
        # built from this repository; use "image: ghcr.io/identicum/launcher:latest" for the published image
        build: ..
        image: launcher:local
        restart: always
        # not published: only IPAx may reach the launcher, or the IPAx-* headers could be forged
        environment:
            ADMIN_ROLE: Launcher_Administrators
            DB_TYPE: postgresql
            DB_HOST: db
            DB_NAME: launcherdb
            DB_USER: launcherusr
            DB_PASSWORD: launcherpwd
            LOG_LEVEL: INFO
        volumes:
            - ./data.json:/data/data.json:ro
        depends_on:
            db:
                condition: service_healthy

    ipax:
        container_name: ipax
        image: ghcr.io/identicum/ipax:latest
        pull_policy: always
        restart: always
        ports:
            - 80:80
        environment:
            IPAX_MODE: proxy
            NGINX_RESOLVER: 127.0.0.11 valid=5s
            OIDC_DISCOVERY: http://idp:8080/realms/launcher/.well-known/openid-configuration
            OIDC_CLIENT_ID: ipax_client_id
            OIDC_CLIENT_SECRET: ipax_client_secret
            OIDC_SCOPE: openid profile email launcher_scope
        volumes:
            - ./ipax/:/var/ipax/proxy_conf.d/:ro
        depends_on:
            idp_config:
                condition: service_completed_successfully
            launcher:
                condition: service_healthy
