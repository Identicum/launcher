[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher"
version = "2.0.0"
description = "Application launcher based on user roles, hosted behind IPAx"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "oracledb>=2.4",
    "pymysql>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx2"]

[project.scripts]
launcher = "launcher.__main__:main"

[tool.setuptools.packages.find]
include = ["launcher*"]

[tool.setuptools.package-data]
launcher = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
